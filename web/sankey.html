<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Valkamakatu 11 – Sankey</title>

  <style>
    #sankeyMeta {
      margin-bottom: 0.5rem;
    }

    #sankeyAnnualMeta {
      margin: 0.5rem 0 1rem;
      padding: 0.75rem 1rem;
      background: #f5f7fa;
      border-left: 4px solid #508cdc;
      font-weight: 600;
    }

    .price-controls { display: flex; flex-wrap: wrap; gap: 1rem 2rem; }
    .price-controls label { display: block; }
    .price-controls input { width: min(100%, 320px); }
    #annualPrices { padding: 1rem; background: #f5f7fa; }
    #annualPrices dt { margin-top: 0.75rem; }
    #annualPrices dd { margin: 0.25rem 0; font-weight: 600; }

    #sankeyChart {
      width: 100%;
      height: 520px;
    }
  </style>
</head>

<body>
  <h1>Valkamakatu 11 – Sankey</h1>

  <label for="sankeyDate">Päivä:</label>
  <input type="date" id="sankeyDate">
  <button type="button" id="sankeyLoadBtn">Näytä</button>

  <p id="sankeyMeta"></p>
  <p id="sankeyAnnualMeta"></p>

  <section id="annualPrices" aria-labelledby="annualPricesTitle">
    <h2 id="annualPricesTitle">Vuosienergian arvo</h2>
    <div class="price-controls">
      <div>
        <label for="purchasePrice">Sähkön hinta: <output id="purchasePriceValue" for="purchasePrice">20,0 snt/kWh</output></label>
        <input id="purchasePrice" type="range" min="0" max="100" step="0.1" value="20">
      </div>
      <div>
        <label for="salePrice">Myydyn sähkön hyvityshinta: <output id="salePriceValue" for="salePrice">5,0 snt/kWh</output></label>
        <input id="salePrice" type="range" min="0" max="100" step="0.1" value="5">
      </div>
    </div>
    <p>Arvio valitun vuoden saatavilla olevasta energiasta käyttäen vakiohintoja.
      Oletushinnat ovat esimerkkejä. Itse käytetty aurinkosähkö = tuotanto − verkkoon myynti.</p>
    <dl aria-live="polite">
      <dt>Ostetun sähkön kustannus</dt><dd id="annualPurchaseCost">–</dd>
      <dt>Itse käytetyn aurinkosähkön säästö</dt><dd id="annualSolarSavings">–</dd>
      <dt>Myydyn sähkön hyvitys</dt><dd id="annualSaleCredit">–</dd>
    </dl>
  </section>

  <div id="sankeyChart"></div>

  <!-- Plotly -->
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.27.0/plotly.min.js"></script>

  <!-- Oma koodi -->
  <script src="/sankey.js"></script>
</body>
</html>
